name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check agent instructions present
        run: |
          grep -q 'data-agent-instructions' _site/index.html
          grep -q 'npx skills add shellui/skills' _site/index.html
          grep -q 'shellui.ai' _site/CNAME
