name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check agent instructions present
        run: |
          grep -q 'data-agent-instructions' _site/index.html
          grep -q 'npx skills add shellui/skills' _site/index.html
          grep -q 'shellui.ai' _site/CNAME
          grep -q '<loc>https://shellui.ai/</loc>' _site/sitemap.xml
          grep -q 'Sitemap: https://shellui.ai/sitemap.xml' _site/robots.txt
          key=$(jq -r .indexNowKey src/_data/site.json); grep -qx "$key" "_site/$key.txt"
          grep -q 'href="https://shellui.ai/"' _site/index.html
          if grep -q 'rel="canonical" href="https://shellui.com' _site/index.html; then exit 1; fi
          if grep -q '"@type": "Organization"' _site/index.html; then exit 1; fi
